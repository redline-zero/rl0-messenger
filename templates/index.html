<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔴 RedLine Zero</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: "Courier New", monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
        }
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .header h1 {
            color: #ff3b3b;
            font-size: 2.5rem;
            text-shadow: 0 0 40px rgba(255,59,59,0.2);
        }
        .header p {
            color: #888;
            margin-top: 10px;
        }
        .status {
            text-align: center;
            padding: 10px;
            color: #4CAF50;
            font-size: 0.9rem;
        }
        .chat {
            background: #0d0d1a;
            border: 1px solid #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            background: #0a0a0f;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .messages .msg {
            padding: 8px 12px;
            margin: 4px 0;
            background: #12121f;
            border-radius: 8px;
            border-left: 3px solid #ff3b3b;
        }
        .messages .msg .user {
            color: #4b69ff;
            font-weight: bold;
        }
        .messages .msg .time {
            color: #444;
            font-size: 0.7rem;
            margin-left: 10px;
        }
        .messages .msg .text {
            margin-top: 3px;
        }
        .messages .system {
            text-align: center;
            color: #888;
            font-style: italic;
            background: transparent;
            border: none;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            background: #12121f;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            color: #e0e0e0;
            outline: none;
            font-family: inherit;
        }
        .input-area input:focus {
            border-color: #ff3b3b;
        }
        .input-area button {
            padding: 12px 24px;
            background: #ff3b3b;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .input-area button:hover {
            background: #ff5555;
        }
        .users-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 0;
        }
        .users-list .user-badge {
            background: #12121f;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid #1a1a2e;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #444;
            font-size: 0.8rem;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .messages { height: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔴 RedLine Zero</h1>
            <p>Анонимный чат</p>
        </div>

        <div class="status" id="status">🟢 Подключено к серверу</div>

        <div class="chat">
            <div class="messages" id="messages">
                <div class="msg system">Добро пожаловать в RedLine Zero</div>
            </div>

            <div class="users-list" id="users"></div>

            <div class="input-area">
                <input type="text" id="username" placeholder="Имя" value="Гость" style="flex: 0.3;">
                <input type="text" id="message" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>

        <div class="footer">🔴 RedLine Zero — 2025</div>
    </div>

    <script>
        const socket = io();
        let username = "Гость";

        const messagesEl = document.getElementById("messages");
        const usersEl = document.getElementById("users");
        const statusEl = document.getElementById("status");
        const usernameInput = document.getElementById("username");
        const messageInput = document.getElementById("message");

        function join() {
            username = usernameInput.value.trim() || "Гость";
            socket.emit("join", { username: username });
            statusEl.textContent = "🟢 В сети: " + username;
        }

        usernameInput.addEventListener("change", join);

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            socket.emit("message", { username: username, message: text });
            messageInput.value = "";
        }

        socket.on("connect", () => {
            join();
        });

        socket.on("user_joined", (data) => {
            addSystemMessage(`👉 ${data.username} присоединился`);
            updateUsers(data.users);
        });

        socket.on("user_left", (data) => {
            addSystemMessage(`👈 ${data.username} покинул`);
        });

        socket.on("new_message", (data) => {
            addMessage(data.username, data.text, data.time);
        });

        function addMessage(user, text, time) {
            const div = document.createElement("div");
            div.className = "msg";
            div.innerHTML = `<span class="user">${user}</span><span class="time">${time || ""}</span><div class="text">${text}</div>`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addSystemMessage(text) {
            const div = document.createElement("div");
            div.className = "msg system";
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function updateUsers(users) {
            usersEl.innerHTML = "";
            if (users) {
                users.forEach(u => {
                    const span = document.createElement("span");
                    span.className = "user-badge";
                    span.textContent = "🟢 " + u;
                    usersEl.appendChild(span);
                });
            }
        }

        fetch("/api/status")
            .then(res => res.json())
            .then(data => {
                statusEl.textContent = "🟢 Онлайн | Пользователей: " + data.users + " | Сообщений: " + data.messages;
            })
            .catch(() => {
                statusEl.textContent = "🔴 Ошибка подключения к серверу";
            });
    </script>
</body>
</html>
